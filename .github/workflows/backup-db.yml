name: Sauvegarde base de données

on:
  schedule:
    # Tous les dimanches à 3h du matin (UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch: {} # permet de lancer une sauvegarde manuellement depuis l'onglet Actions

jobs:
  backup:
    name: Export PostgreSQL (pg_dump)
    runs-on: ubuntu-latest
    steps:
      - name: Installer les outils PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Exporter la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f backup/sthecroh-$(date +%Y-%m-%d).dump

      - name: Conserver la sauvegarde (90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: sthecroh-backup-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 90
